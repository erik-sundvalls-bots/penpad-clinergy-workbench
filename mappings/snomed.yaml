      workbench review. Used only when the finding location is Thumb.
    source: >
      Workbench thumb-pain-terms.yaml (2026-11-16); re-checked 2026-11-17,
      edition 20260801, active. In finding-site range (ECL << 442083009,
      2026-11-17).
