<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="152" viewBox="0 0 96 152" role="img" aria-label="Hand front (placeholder)">
  <title>Hand front (placeholder) — PLACEHOLDER · CC0</title>
  <!-- Independent outline artwork for the PEN&amp;PAD-style body-map remake.
       Not traced from the 1998 Clinergy bitmaps. Dedicated to the public domain (CC0 1.0). -->
