  <text x="48.0" y="12" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8a6a28">PLACEHOLDER · CC0</text>
  <!-- palm -->
  <path d="M34 40 L88 42 L90 100 L32 100 Z" fill="#efe8d8" stroke="#2c4a38" stroke-width="1.5"/>
  <!-- thumb (left) -->
