  <text x="22" y="78" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#3d3a34">thumb</text>
  <!-- index -->
  <rect x="28" y="8" width="14" height="36" rx="5" fill="#efe8d8" stroke="#2c4a38" stroke-width="1.4"/>
  <!-- middle -->
  <rect x="44" y="4" width="14" height="40" rx="5" fill="#efe8d8" stroke="#2c4a38" stroke-width="1.4"/>
  <!-- ring -->
  <rect x="60" y="8" width="13" height="36" rx="5" fill="#efe8d8" stroke="#2c4a38" stroke-width="1.4"/>
  <!-- little -->
  <rect x="74" y="16" width="12" height="30" rx="5" fill="#efe8d8" stroke="#2c4a38" stroke-width="1.4"/>
  <text x="60" y="120" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#5c564c">hand (front)</text>

  <text x="4" y="144" font-family="system-ui,sans-serif" font-size="7" fill="#9a8f7c">PLACEHOLDER · CC0</text>

