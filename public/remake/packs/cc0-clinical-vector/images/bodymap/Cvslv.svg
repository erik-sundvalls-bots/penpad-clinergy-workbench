<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Leg Veins Anatomy -->
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="257" viewBox="0 0 224 257" shape-rendering="geometricPrecision">
  <title>Leg Veins Anatomy</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="224" height="257" fill="#FFFFFF"/>

  <g id="leg-veins" transform="scale(1,0.9312)">
    <path d="
      M 34,14 C 34,52 36,92 40,122
      C 38,136 37,148 39,162
      C 36,180 35,200 38,222
      C 39,234 37,244 33,256
      C 30,264 33,271 42,271
      C 53,271 63,266 64,258
      C 64,248 60,236 59,224
      C 62,204 66,180 68,158
      C 69,144 67,132 66,120
      C 71,88 74,48 75,14
      " fill="#F8F9FB" stroke="#8594A3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Venous tree (blue):
         Femoral [36..113,46..60], LongSaphenous [50..135,60..72],
         Popliteal [114..148,43..58], ShortSaphenous [153..214,32..48] -->
    <g fill="none" stroke="#2D6BA8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Femoral -> Popliteal deep vein -->
      <path d="M 55,14 C 54,48 53,84 52,118 C 51,134 50,148 49,168 L 48,238" stroke-width="2.7"/>
      <!-- Great / Long Saphenous Vein (medial/right side: x=64..66) -->
      <path d="M 55,34 C 63,46 66,68 65,102 C 63,142 58,194 54,248 L 44,262" stroke-width="2.1"/>
      <!-- Short Saphenous Vein (posterior-lateral calf: x=40..44) -->
      <path d="M 51,134 C 45,152 40,180 40,214 C 40,234 38,248 36,260" stroke-width="1.9"/>
    </g>

    <g stroke="#2B3A4A" stroke-width="0.85" fill="none">
      <line x1="90" y1="80" x2="54" y2="80"/>
      <line x1="90" y1="104" x2="65" y2="104"/>
      <line x1="90" y1="129" x2="51" y2="129"/>
      <line x1="90" y1="170" x2="41" y2="170"/>
    </g>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#2B3A4A">
      <text x="94" y="83">femoral vein</text>
      <text x="94" y="107">long saphenous vein</text>
      <text x="94" y="132">popliteal vein</text>
      <text x="94" y="173">short saphenous vein</text>
    </g>
  </g>
</svg>
