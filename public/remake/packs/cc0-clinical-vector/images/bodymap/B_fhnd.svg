    <path d="M 43,36 Q 59,39 76,36" fill="none" stroke="#5A6C7E" stroke-width="1.0" stroke-linecap="round"/>
    <path d="M 44,41 Q 59,43.5 75,41" fill="none" stroke="#8594A3" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Palmar creases (thenar / proximal & distal transverse) -->
    <path d="M 42,49 C 47,58 49,69 47,81" fill="none" stroke="#5A6C7E" stroke-width="1.0" stroke-linecap="round"/>
    <path d="M 44,64 C 55,66 67,69 78,74" fill="none" stroke="#5A6C7E" stroke-width="0.95" stroke-linecap="round"/>
    <path d="M 52,79 C 62,79 72,77 81,71" fill="none" stroke="#8594A3" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Palmar digital flexion creases (MCP/PIP/DIP) -->
    <g stroke="#5A6C7E" stroke-width="0.85" stroke-linecap="round">
      <!-- Thumb IP crease -->
      <path d="M 19,77 L 26,81"/>
      <!-- Index -->
      <path d="M 34.5,96 L 42.5,96.5 M 32.5,110 L 40.5,111 M 30.8,122 L 38.2,123"/>
