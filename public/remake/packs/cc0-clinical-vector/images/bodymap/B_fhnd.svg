    <path d="
      M 42,14
      C 42,24 41,34 39,41
      C 35,48 27,57 20,67
      C 14.5,75 10.5,83 10.5,89.5
      C 10.5,95 15.5,97.5 19.5,95
      C 23.5,92.5 27.5,85 31.5,78
      C 33,76 34.5,76.5 34.2,80
      C 33.5,89 31.5,103 29.5,116
      C 28.2,124.5 28.2,133.5 33,134.5
      C 37.5,135.5 39.8,128 41.2,118
      C 42.2,109 43.2,100 44,95
      C 44.5,103 44.5,120 44.8,133
      C 45,140.5 47.2,144 50.8,144
      C 54.5,144 56.2,139.5 56.5,132
      C 56.8,120 57.2,103 57.6,95
      C 58.2,103 58.8,119 59.5,131
