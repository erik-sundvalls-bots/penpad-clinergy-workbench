      L 20.5,24
      C 20,34 17.5,41 15,49
      C 11.5,60 12,73 13.5,85
      C 14.2,94 13.8,104 12.8,113
      C 12,119.5 13.2,124.5 16.5,125.5
      C 19.5,126.2 21.8,123.5 22.8,118
      C 24,109 25.2,99 26.2,92
      C 26.5,100 26.5,115 26.8,125.5
      C 27,132.5 29,137 32.5,137.5
      C 36,138 38.2,134 38.8,127
      C 39.5,115 40,100 40.6,92
      C 41,100 41.2,117 41.5,128.5
      C 41.8,136 43.8,140.5 47.5,140.5
      C 51.2,140.5 53.2,136 53.5,129
      C 53.8,117 53.8,100 54.4,92
      C 55.2,98 56.2,107 57.2,116
      C 58.5,125.5 60.8,132.5 65.2,131.5
      C 69.8,130.5 70,121.5 68.8,113
      C 66.8,100 64.8,86 64.2,77
      C 64,74 65.5,73.5 67,76
      C 71,83 75,91 79.2,94.5
      C 83.2,97.5 88.2,94.8 88.2,89
      C 88.2,82.5 84,74 78.5,66
      C 71.5,56 63.5,47 59.5,40
      C 57.5,33 56.5,24 56.5,14
      Z" fill="url(#skinGrad)" stroke="none"/>

    <!-- Open-top wrist outline -->
    <path d="
      M 21,14
      L 20.5,24
      C 20,34 17.5,41 15,49
      C 11.5,60 12,73 13.5,85
      C 14.2,94 13.8,104 12.8,113
      C 12,119.5 13.2,124.5 16.5,125.5
      C 19.5,126.2 21.8,123.5 22.8,118
      C 24,109 25.2,99 26.2,92
      C 26.5,100 26.5,115 26.8,125.5
      C 27,132.5 29,137 32.5,137.5
      C 36,138 38.2,134 38.8,127
      C 39.5,115 40,100 40.6,92
      C 41,100 41.2,117 41.5,128.5
      C 41.8,136 43.8,140.5 47.5,140.5
      C 51.2,140.5 53.2,136 53.5,129
      C 53.8,117 53.8,100 54.4,92
      C 55.2,98 56.2,107 57.2,116
      C 58.5,125.5 60.8,132.5 65.2,131.5
      C 69.8,130.5 70,121.5 68.8,113
      C 66.8,100 64.8,86 64.2,77
      C 64,74 65.5,73.5 67,76
      C 71,83 75,91 79.2,94.5
      C 83.2,97.5 88.2,94.8 88.2,89
      C 88.2,82.5 84,74 78.5,66
      C 71.5,56 63.5,47 59.5,40
      C 57.5,33 56.5,24 56.5,14
      " fill="none" stroke="#2B3A4A" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtle dorsal extensor tendons & MCP knuckles -->
    <path d="M 31,42 L 24,78 M 39,40 L 36,78 M 46,41 L 47,78 M 52,44 L 58,76"
          fill="none" stroke="#8594A3" stroke-width="0.8" stroke-linecap="round" opacity="0.75"/>
    <path d="M 18,82 Q 21,80 24,82 M 30,82 Q 33,79.5 36.5,82 M 43.5,82 Q 47,79.5 50.5,82 M 56.5,81 Q 60,79 63,81"
          fill="none" stroke="#5A6C7E" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Dorsal Interphalangeal Joint skin folds:
         Thumb IP [39..80, 66..84], Fingers PIP/DIP [88..114, 3..70] -->
    <g stroke="#5A6C7E" stroke-width="0.95" stroke-linecap="round">
      <!-- Thumb IP joint -->
      <path d="M 70,69 Q 75,67 79,71 M 72,73 Q 76,71.5 80,74.5"/>
      <!-- Little finger PIP/DIP -->
      <path d="M 15.5,98 Q 19,96.5 22.5,98 M 14.8,108 Q 18,107 21.5,108.5"/>
      <!-- Ring finger PIP/DIP -->
      <path d="M 28.5,99 Q 33,97 37.5,99 M 28.5,110.5 Q 33,109 37.5,110.5"/>
      <!-- Middle finger PIP/DIP -->
      <path d="M 43,100 Q 47.5,98 52,100 M 43,112 Q 47.5,110.5 52,112"/>
      <!-- Index finger PIP/DIP -->
      <path d="M 57,97.5 Q 61.5,96 65.5,98 M 58.5,108.5 Q 63,107 67,109"/>
    </g>

    <!-- Five crisp pale alabaster fingernails:
         Thumb nail [79..101, 73..91], Finger nails [113..142, 9..75] -->
    <!-- Thumb nail -->
    <path d="M 79,82 C 82,80.5 86,83 87.2,87.5 C 88,91 85.5,94.5 82.5,93.5 C 79.5,92 77.5,87 79,82 Z"
          fill="#F8F6F3" stroke="#2B3A4A" stroke-width="0.95"/>
    <!-- Little fingernail -->
    <path d="M 14.2,114.5 C 16,113.2 19.5,113.5 21,115.5 L 20.4,121.8 C 19,124 15,123.8 13.8,121.2 Z"
          fill="#F8F6F3" stroke="#2B3A4A" stroke-width="0.95"/>
    <!-- Ring fingernail -->
    <path d="M 29,122.5 C 31,121 35,121 36.8,123 L 36.5,132.5 C 35,135.2 30.5,135.2 29,132.2 Z"
          fill="#F8F6F3" stroke="#2B3A4A" stroke-width="0.95"/>
    <!-- Middle fingernail -->
    <path d="M 43.5,124.5 C 45.5,123 49.5,123 51.5,125 L 51.2,135.5 C 49.5,138.2 45.2,138.2 43.5,135.2 Z"
          fill="#F8F6F3" stroke="#2B3A4A" stroke-width="0.95"/>
    <!-- Index fingernail -->
    <path d="M 59.8,118 C 61.8,116.5 65.8,116.8 67.5,119 L 68.2,126.5 C 67,129.5 62.5,129.8 60.8,127 Z"
          fill="#F8F6F3" stroke="#2B3A4A" stroke-width="0.95"/>
