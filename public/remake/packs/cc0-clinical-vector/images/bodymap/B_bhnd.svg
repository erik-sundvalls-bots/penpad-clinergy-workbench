<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Dorsal Surface of Hand -->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="148" viewBox="0 0 96 148" shape-rendering="geometricPrecision">
  <title>Dorsal Surface of Hand</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="28%" stop-color="#F3EFEA"/>
      <stop offset="72%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="mucosaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BDB5"/>
      <stop offset="100%" stop-color="#D49B91"/>
    </linearGradient>
    
  </defs>
  <rect width="96" height="148" fill="#FFFFFF"/>

  <g id="dorsal-hand">
