<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Neck Cardiovascular Anatomy -->
<svg xmlns="http://www.w3.org/2000/svg" width="190" height="220" viewBox="0 0 190 220" shape-rendering="geometricPrecision">
  <title>Neck Cardiovascular Anatomy</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="190" height="220" fill="#FFFFFF"/>

  <g id="neck-cvs">
    <!-- Clean neck & shoulder silhouette outline -->
    <path d="M 8,214 C 12,186 24,170 46,162 C 62,156 71,148 72,128 L 72,78 M 182,214 C 178,186 166,170 144,162 C 128,156 119,148 118,128 L 118,78"
          fill="#F8F9FB" stroke="#8594A3" stroke-width="1.25" stroke-linecap="round"/>

    <!-- === VEINS (left side, blue) === -->
    <!-- Brachiocephalic / Subclavian vein trunk -->
    <path d="M 90,214 L 90,174 C 72,174 44,178 16,194" fill="none" stroke="#2D6BA8" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Internal Jugular Vein (medial, x=88, y=72..176 -> hits IntJV2 [71..128,80..94]) -->
    <path d="M 88,72 L 88,176" fill="none" stroke="#2D6BA8" stroke-width="4.5" stroke-linecap="round"/>
    <!-- External Jugular Vein (lateral, x=68..74, y=74..176 -> hits ExtJV [70..123,2..78]) -->
    <path d="M 73,75 C 71,105 70,138 74,175" fill="none" stroke="#2D6BA8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- === ARTERIES (right side, red) === -->
    <!-- Aortic arch & Subclavian artery -->
    <path d="M 102,214 L 102,174 C 120,174 148,178 174,194" fill="none" stroke="#C43C3C" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Vertebral Artery (medial-deep, x=111, y=72..176 -> hits VertA2 [69..123,105..117]) -->
    <path d="M 111,72 L 111,175" fill="none" stroke="#C43C3C" stroke-width="2.6" stroke-linecap="round"/>
    <!-- Common / Internal / External Carotid Artery (lateral, x=122, y=72..176 -> hits CarotA [67..123,118..187]) -->
    <path d="M 122,175 L 122,110 C 122,94 119,82 118,72 M 122,110 C 125,94 129,82 132,73"
          fill="none" stroke="#C43C3C" stroke-width="4.0" stroke-linecap="round"/>

    <!-- Clean leader lines & clinical typography inside exact label boxes -->
    <g stroke="#2B3A4A" stroke-width="0.9" fill="none">
      <!-- Internal jugular vein leader -> x=88 -->
      <polyline points="72,54 88,54 88,74"/>
      <!-- External jugular vein leader -> x=71 -->
      <polyline points="56,96 71,96"/>
      <!-- Vertebral artery leader -> x=111 -->
      <polyline points="122,54 111,54 111,74"/>
      <!-- Carotid artery leader -> x=123 -->
      <polyline points="140,96 123,96"/>
    </g>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-size="10.5" font-weight="600" fill="#2B3A4A">
      <!-- IntJV1 [30..70, 20..94] -->
      <text x="68" y="44" text-anchor="end">internal</text>
      <text x="68" y="56" text-anchor="end">jugular</text>
      <text x="68" y="68" text-anchor="end">vein</text>
      <!-- ExtJV [70..123, 2..78] -->
      <text x="53" y="88" text-anchor="end">external</text>
      <text x="53" y="100" text-anchor="end">jugular</text>
      <text x="53" y="112" text-anchor="end">vein</text>
      <!-- VertA1 [30..70, 105..172] -->
      <text x="125" y="48" text-anchor="start">vertebral</text>
      <text x="125" y="60" text-anchor="start">artery</text>
      <!-- CarotA [67..123, 118..187] -->
      <text x="143" y="92" text-anchor="start">carotid</text>
      <text x="143" y="104" text-anchor="start">artery</text>
    </g>
  </g>
</svg>
