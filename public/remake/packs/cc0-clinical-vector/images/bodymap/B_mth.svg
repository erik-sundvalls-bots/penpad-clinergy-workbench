<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Oral Cavity Sagittal Schematic -->
<svg xmlns="http://www.w3.org/2000/svg" width="176" height="218" viewBox="0 0 176 218" shape-rendering="geometricPrecision">
  <title>Oral Cavity Sagittal Schematic</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="28%" stop-color="#F3EFEA"/>
      <stop offset="72%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="mucosaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5BDB5"/>
      <stop offset="100%" stop-color="#D49B91"/>
    </linearGradient>
    
  </defs>
  <rect width="176" height="218" fill="#FFFFFF"/>

  <g id="mouth-sagittal">
    <!-- Outer sagittal head/face tissue fill (open-crop on top/right/bottom) -->
    <path d="
      M 80,14
      C 70,32 60,54 54,70
      C 48,84 32,96 22,106
      C 15,113 17,120 26,122
      C 33,123.5 38,125 36,129
      C 32,131 23,132.5 22,137.5
      C 21.5,141.5 28,144 36,144
      C 44,144 50,144 52,146
      L 52,152
      C 45,152 34,151.5 27,153.5
      C 21,155.5 21,161.5 27,164
      C 32,166 36,168.5 34,173
      C 31,179 25,184 26,192
      C 27.5,201 38,207 54,208
      C 70,209 86,207 98,212
      L 168,212
      L 168,14
      Z" fill="url(#skinGrad)" stroke="none"/>

    <!-- Facial profile stroke only (clean open-crop edges) -->
    <path d="
      M 80,14
      C 70,32 60,54 54,70
      C 48,84 32,96 22,106
      C 15,113 17,120 26,122
      C 33,123.5 38,125 36,129
      " fill="none" stroke="#2B3A4A" stroke-width="1.45" stroke-linecap="round"/>
    <path d="
      M 34,167
      C 35.5,170 34.5,172.5 33,174.5
      C 30.5,179.5 25,184.5 26,192
      C 27.5,201 38,207 54,208
      C 70,209 86,207 98,212
      " fill="none" stroke="#2B3A4A" stroke-width="1.45" stroke-linecap="round"/>

    <!-- Subtle nasal vestibule / nasal floor above hard palate -->
    <path d="
      M 40,104
      C 55,96 86,93 116,96
      C 134,98 148,108 154,126
      L 154,152
      L 132,152
      C 132,135 128,122 118,115
      C 102,106 70,105 44,113
      Z" fill="#FAF3F1" stroke="#5A6C7E" stroke-width="0.9" opacity="0.55"/>

    <!-- Oral cavity & oropharynx airway lumen -->
    <path d="
      M 34,144
      C 42,130 56,118 82,116
      C 106,114 126,120 135,134
      C 142,145 148,162 152,184
      L 156,212
      L 128,212
      C 128,195 126,180 122,172
      C 114,162 94,164 68,164
      C 52,164 42,160 36,153
      Z" fill="#FAF3F1" stroke="none"/>
    <path d="
      M 34,144
      C 42,130 56,118 82,116
      C 106,114 126,120 135,134
      C 142,145 148,162 152,184
      L 156,212
      M 128,212
      C 128,195 126,180 122,172
      C 114,162 94,164 68,164
      C 52,164 42,160 36,153
      " fill="none" stroke="#2B3A4A" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Roof of mouth: hard palate + soft palate & uvula [102..118, 43..121] -->
    <path d="
      M 44,118
      C 54,108 78,104 102,106
      C 118,107.5 128,113 134,124
      C 136.5,129 135.5,135.5 132,136.5
      C 129,137.5 126.5,133.5 125.5,128
      C 123,120 114,116 98,115
      C 76,114 58,117 48,123
      Z" fill="url(#mucosaGrad)" stroke="#2B3A4A" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- Upper alveolar ridge / Gum [116..130, 54..112] -->
    <path d="
      M 44,127
      C 48,120 62,116.5 84,116.5
      C 102,116.5 113,119.5 116,126.5
      C 114,129.5 104,130.5 84,130.5
      C 62,130.5 50,130 44,127
      Z" fill="#D49B91" stroke="#2B3A4A" stroke-width="1.05"/>

    <!-- Upper Teeth row [126..141, 43..109] -->
    <g fill="#FDFCFA" stroke="#2B3A4A" stroke-width="1.05" stroke-linejoin="round">
      <path d="M 45,127.5 L 54,127.5 L 53.5,139.5 C 51,141 47.5,141 45.5,139.2 Z"/>
      <path d="M 54,127.5 L 63.5,127.5 L 63,139.8 C 60.5,141.2 57,141 54.5,139.5 Z"/>
      <path d="M 63.5,127.5 L 74.5,127.5 L 74,139 C 71,140.5 67,140.5 64,139 Z"/>
      <path d="M 74.5,127.5 L 85.5,127.5 L 85,138.8 C 82,140.2 78,140.2 75,138.8 Z"/>
      <path d="M 85.5,127.5 L 98,127.5 L 97.5,138.5 C 94,140 89,140 86,138.5 Z"/>
      <path d="M 98,127.5 L 110,127.5 L 109.2,138 C 106,139.5 101,139.5 98.5,138 Z"/>
    </g>

    <!-- Inside of cheek / buccal mucosa shading [133..152, 49..124] -->
    <path d="M 52,141 C 74,142 104,141 122,144 C 122,149 116,151 96,151 C 74,151 58,150 52,148 Z"
          fill="#E5BDB5" opacity="0.45"/>
    <path d="M 55,146 Q 88,145 121,147" fill="none" stroke="#B6766B" stroke-width="0.8" stroke-dasharray="3,2.5" opacity="0.65"/>

    <!-- Lower teeth front hint & lower gum -->
    <path d="M 46,154 L 54.5,154 L 54,162.5 L 46.5,162.5 Z" fill="#FDFCFA" stroke="#2B3A4A" stroke-width="1"/>
    <path d="M 54.5,154.5 L 62,154.5 L 61.5,162 L 54.5,162 Z" fill="#FDFCFA" stroke="#2B3A4A" stroke-width="1"/>
    <path d="M 44,162.5 Q 53,165.5 62,162.5" fill="none" stroke="#B6766B" stroke-width="1.25"/>

    <!-- Tongue [149..168, 60..130] -->
    <path d="
      M 58,158
      C 62,151.5 76,148.5 96,149
      C 115,149.5 128,155 133,167
      C 136,174 136,184 134,193
      C 131,196 127,194 124,186
      C 118,174 108,168 92,168
      C 76,168 65,167 59,163.5
      C 57,162 56.8,160 58,158
      Z" fill="url(#mucosaGrad)" stroke="#2B3A4A" stroke-width="1.25" stroke-linejoin="round"/>
    <path d="M 68,157 C 82,154 102,154 118,158" fill="none" stroke="#B6766B" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Posterior pharyngeal wall / Throat [149..211, 129..165] -->
    <path d="M 149,136 C 155,152 159,174 161,212 L 151,212 C 148,182 145,160 139,144 Z"
          fill="#E5BDB5" stroke="none"/>
    <path d="M 149,136 C 155,152 159,174 161,212 M 151,212 C 148,182 145,160 139,144"
          fill="none" stroke="#2B3A4A" stroke-width="1.05" stroke-linecap="round"/>
    <path d="M 134,188 C 138,181 141,179 142.5,183 C 143.5,186 141,196 138,209" fill="none" stroke="#2B3A4A" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Upper & lower lips [126..180, 18..44] -->
    <path d="M 22.5,137.5 C 25,133.5 32,131.5 39,133 C 42.5,134 44,137.5 43,141.5 C 40,143.5 30,144 24,142 C 21.8,141 21.5,139 22.5,137.5 Z"
          fill="#E5BDB5" stroke="#2B3A4A" stroke-width="1.15"/>
    <path d="M 23.5,156.5 C 26,153.5 34,152.5 41,154 C 44,155.5 44,160 41,163.5 C 36,166.5 28,165.5 24,162.5 C 21.8,160.8 22,158.2 23.5,156.5 Z"
          fill="#E5BDB5" stroke="#2B3A4A" stroke-width="1.15"/>
    <path d="M 38,176 Q 44,184 48,195" fill="none" stroke="#5A6C7E" stroke-width="0.85" stroke-linecap="round"/>
  </g>
</svg>
