<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Leg Nerves Anatomy -->
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="257" viewBox="0 0 224 257" shape-rendering="geometricPrecision">
  <title>Leg Nerves Anatomy</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="224" height="257" fill="#FFFFFF"/>

  <g id="leg-nerves" transform="scale(1,0.9625)">
    <!-- Clean posterior leg outline on left (x=50..100) -->
    <path d="
      M 52,12 C 52,48 54,84 58,112
      C 56,126 55,138 56,154
      C 53,174 52,196 55,220
      C 56,232 54,244 50,254
      C 48,260 54,264 66,264
      C 78,264 84,259 83,250
      C 82,238 82,226 84,214
      C 88,194 92,172 93,150
      C 94,136 92,124 91,112
      C 95,82 98,46 98,12
      " fill="#F8F9FB" stroke="#8594A3" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Peripheral leg nerves (emerald green):
         Sciatic [13..92, 58..84], CommonPeroneal [100..134, 76..98],
         Tibial [138..201, 62..75], Sural [172..236, 72..84] -->
    <g fill="none" stroke="#268C5C" stroke-linecap="round" stroke-linejoin="round">
      <!-- Sciatic trunk descending posterior thigh -->
      <path d="M 70,12 C 71,40 72,72 73,104" stroke-width="3.0"/>
      <!-- Common peroneal nerve branching laterally around fibular neck [100..134, 76..98] -->
      <path d="M 73,100 C 81,110 88,124 90,142 C 91,164 89,192 85,226 L 78,252" stroke-width="2.0"/>
      <!-- Tibial nerve continuing centrally down calf [138..201, 62..75] -->
      <path d="M 73,102 C 71,130 69,166 67,204 C 66,226 65,244 63,256" stroke-width="2.2"/>
      <!-- Sural nerve descending superficial posterior calf [172..236, 72..84] -->
      <path d="M 72,134 C 76,158 78,186 78,216 C 78,232 76,244 73,254" stroke-width="1.7"/>
    </g>

    <g stroke="#2B3A4A" stroke-width="0.85" fill="none">
      <line x1="112" y1="38" x2="72" y2="38"/>
      <line x1="112" y1="118" x2="86" y2="118"/>
      <line x1="112" y1="160" x2="70" y2="160"/>
      <line x1="112" y1="198" x2="78" y2="198"/>
    </g>
    <g font-family="DejaVu Sans, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#2B3A4A">
      <text x="116" y="41">sciatic nerve</text>
      <text x="116" y="121">common peroneal</text>
      <text x="116" y="163">tibial nerve</text>
      <text x="116" y="201">sural nerve</text>
    </g>
  </g>
</svg>
