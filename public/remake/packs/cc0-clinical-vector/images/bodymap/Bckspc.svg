<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Back and Spinal Cord -->
<svg xmlns="http://www.w3.org/2000/svg" width="166" height="264" viewBox="0 0 166 264" shape-rendering="geometricPrecision">
  <title>Back and Spinal Cord</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="166" height="264" fill="#FFFFFF"/>
<g id="m_back">
    <!-- Posterior torso fill -->
    <path d="
      M 64,14
      C 63,24 60,32 50,36
      C 34,41 20,44 16,56
      C 13,70 12,92 13,114
      L 35,114
      C 36,104 37,96 38,92
      C 39,112 39,140 39,162
      C 39,180 33,198 31,218
      C 30,234 33,248 36,258
      L 130,258
      C 133,248 136,234 135,218
      C 133,198 127,180 127,162
      C 127,140 127,112 128,92
      C 129,96 130,104 131,114
      L 153,114
      C 154,92 153,70 150,56
      C 146,44 132,41 116,36
      C 106,32 103,24 102,14
      Z" fill="url(#skinHoriz)" stroke="none"/>

    <!-- Outer shoulder, arm & torso outlines -->
    <path d="
      M 64,14
      C 63,24 60,32 50,36
      C 34,41 20,44 16,56
      C 13,70 12,92 13,114
      " fill="none" stroke="#2B3A4A" stroke-width="1.45" stroke-linecap="round"/>
    <path d="
      M 102,14
      C 103,24 106,32 116,36
      C 132,41 146,44 150,56
      C 153,70 154,92 153,114
      " fill="none" stroke="#2B3A4A" stroke-width="1.45" stroke-linecap="round"/>
    <!-- Inner axillary / lateral torso / hip outlines -->
    <path d="M 35,114 C 36,102 37,92 40,84" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 38,94 C 39,114 39,140 39,162 C 39,180 33,198 31,218 C 30,234 33,248 36,258"
          fill="none" stroke="#2B3A4A" stroke-width="1.45" stroke-linecap="round"/>
    <path d="M 131,114 C 130,102 129,92 126,84" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 128,94 C 127,114 127,140 127,162 C 127,180 133,198 135,218 C 136,234 133,248 130,258"
          fill="none" stroke="#2B3A4A" stroke-width="1.45" stroke-linecap="round"/>

    <!-- Midline spinal furrow & subtle anatomical landmarks (Cervical -> Thoracic -> Lumbar -> Sacral -> Coccygeal) -->
    <path d="M 83,24 L 83,200" fill="none" stroke="#5A6C7E" stroke-width="1.15" stroke-linecap="round"/>
    <!-- Subtle C7 cervical landmark [24..46] -->
    <path d="M 78,41 Q 83,43.5 88,41" fill="none" stroke="#5A6C7E" stroke-width="0.9" stroke-linecap="round"/>
    <!-- Subtle paraspinal soft contours (no harsh cross-ticks) -->
    <path d="M 78.5,58 C 77.5,82 78,108 79,134 C 79.5,148 79.5,160 78.5,172" fill="none" stroke="#8594A3" stroke-width="0.65" stroke-linecap="round" opacity="0.55"/>
    <path d="M 87.5,58 C 88.5,82 88,108 87,134 C 86.5,148 86.5,160 87.5,172" fill="none" stroke="#8594A3" stroke-width="0.65" stroke-linecap="round" opacity="0.55"/>

    <!-- Scapular contours [50..105, 41..67 & 95..124] -->
    <path d="M 45,62 C 44,78 48,94 60,101 C 64,97 67,85 67,70" fill="none" stroke="#5A6C7E" stroke-width="1.1" stroke-linecap="round"/>
    <path d="M 121,62 C 122,78 118,94 106,101 C 102,97 99,85 99,70" fill="none" stroke="#5A6C7E" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Subtle posterior lower rib & loin contours [104..148 & 147..195] -->
    <path d="M 48,124 C 54,132 62,138 69,141 M 118,124 C 112,132 104,138 97,141" fill="none" stroke="#8594A3" stroke-width="0.8" stroke-linecap="round"/>
    <path d="M 47,162 C 52,172 59,180 68,184 M 119,162 C 114,172 107,180 98,184" fill="none" stroke="#8594A3" stroke-width="0.8" stroke-linecap="round"/>

    <!-- Sacral dimples [174..217, 66..101] -->
    <circle cx="74.5" cy="186" r="1.4" fill="#8594A3" opacity="0.75"/>
    <circle cx="91.5" cy="186" r="1.4" fill="#8594A3" opacity="0.75"/>

    <!-- Gluteal cleft (CoccygealRegion [216..239]) & Buttock contours [193..256, 30..72 & 100..138] -->
    <path d="M 83,204 L 83,254" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 39,243 C 52,253 71,254 82,247" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 127,243 C 114,253 95,254 84,247" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <!-- Inner thigh start below gluteal fold -->
    <path d="M 83,250 L 83,258" fill="none" stroke="#2B3A4A" stroke-width="1.3"/>
  </g>

  <g id="spinal-cord-overlay" stroke-linecap="round">
    <!-- Vertebral canal subtle highlight -->
    <rect x="78" y="20" width="9" height="196" rx="4" fill="#FFFFFF" opacity="0.55"/>
    <!-- Spinal cord trunk (cervical & lumbar enlargements) -->
    <path d="M 80,20 L 85,20 C 86,38 86,52 84.5,64 L 84.5,134 C 85.8,148 85.5,164 83.5,176 L 81.5,176 C 79.5,164 79.2,148 80.5,134 L 80.5,64 C 79,52 79,38 80,20 Z"
          fill="#52B582" stroke="#268C5C" stroke-width="1.2"/>
    <line x1="82.5" y1="22" x2="82.5" y2="174" stroke="#FFFFFF" stroke-width="0.7" opacity="0.7"/>
    <path d="M 80,28 L 72,33 M 85,28 L 93,33" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,39 L 72,44 M 85,39 L 93,44" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,50 L 72,55 M 85,50 L 93,55" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,61 L 72,66 M 85,61 L 93,66" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,72 L 72,77 M 85,72 L 93,77" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,83 L 72,88 M 85,83 L 93,88" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,94 L 72,99 M 85,94 L 93,99" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,105 L 72,110 M 85,105 L 93,110" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,116 L 72,121 M 85,116 L 93,121" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,127 L 72,132 M 85,127 L 93,132" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,138 L 72,143 M 85,138 L 93,143" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,149 L 72,154 M 85,149 L 93,154" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,160 L 72,165 M 85,160 L 93,165" stroke="#268C5C" stroke-width="1.05"/><path d="M 80,171 L 72,176 M 85,171 L 93,176" stroke="#268C5C" stroke-width="1.05"/>
    
      <path d="M 81,172 C 79,188 77,202 75,214 M 82.5,172 L 82.5,215 M 84,172 C 86,188 88,202 90,214"
            fill="none" stroke="#268C5C" stroke-width="1.2"/>
      <path d="M 81,180 C 78,194 74,205 71,212 M 84,180 C 87,194 91,205 94,212"
            fill="none" stroke="#52B582" stroke-width="0.95"/>
    
  </g>
</svg>
