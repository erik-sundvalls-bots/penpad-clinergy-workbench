<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Digestive System Overview -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="330" viewBox="0 0 240 330" shape-rendering="geometricPrecision">
  <title>Digestive System Overview</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="240" height="330" fill="#FFFFFF"/>

  <g id="digestive-main">
    <!-- Head-in-profile (left) & anterior torso silhouette -->
    <path d="
      M 56,288
      L 56,162
      C 56,144 60,132 72,126
      C 84,120 97,117 100,106
      C 100,98 97,91 92,88
      C 84,88 79,86 78,81
      C 78,77 81,75 83,74
      C 78,71 78,66 84,64
      C 78,61 74,58 76,54
      C 80,49 85,42 87,36
      C 92,26 106,22 124,24
      C 140,26 150,40 148,62
      C 146,80 139,94 136,106
      C 136,116 146,120 162,125
      C 176,130 182,144 182,166
      L 182,288
      " fill="#F8F9FB" stroke="#8594A3" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Oral cavity [60..82, 82..119] & Esophagus [83..163, 112..130] -->
    <path d="M 82,68 C 92,65 110,65 118,74 C 122,80 123,92 123,110 L 123,164 L 116,164 L 116,110 C 116,94 115,82 110,77 C 102,74 90,75 82,74 Z"
          fill="#D8A39B" stroke="#2B3A4A" stroke-width="1.05" stroke-linejoin="round"/>

    <!-- Salivary glands: parotid [55..75, 110..125] & submandibular/sublingual [75..86, 89..106] -->
    <ellipse cx="117" cy="65" rx="6" ry="7.5" fill="#E0B95B" stroke="#9C7823" stroke-width="1.0"/>
    <ellipse cx="97.5" cy="80.5" rx="6.5" ry="3.8" fill="#E0B95B" stroke="#9C7823" stroke-width="1.0"/>

    <!-- Stomach [162..203, 119..158] (behind left lobe of liver) -->
    <path d="
      M 122,162
      C 129,159 144,162 151,171
      C 158,180 156,196 145,202
      C 135,207 122,204 114,197
      C 109,193 111,185 117,183
      C 123,181 124,172 118,165
      Z" fill="#D9A99A" stroke="#2B3A4A" stroke-width="1.2"/>

    <!-- Duodenum [188..213, 96..124] & Pancreas [197..208, 101..121] -->
    <path d="M 114,194 C 103,193 99,200 101,208 C 103,214 114,215 122,212" fill="none" stroke="#DFC0AE" stroke-width="6" stroke-linecap="round"/>
    <path d="M 114,194 C 103,193 99,200 101,208 C 103,214 114,215 122,212" fill="none" stroke="#2B3A4A" stroke-width="1.0" stroke-linecap="round"/>
    <path d="M 103,204 C 110,201 120,201 127,204 C 122,208 111,209 103,204 Z" fill="#E0B95B" stroke="#9C7823" stroke-width="0.95"/>

    <!-- Gallbladder [190..209, 87..99] -->
    <ellipse cx="93" cy="200" rx="4.5" ry="7.2" transform="rotate(14 93 200)" fill="#5B8F56" stroke="#2B3A4A" stroke-width="1.0"/>

    <!-- Liver [163..204, 78..131] -->
    <path d="
      M 80,196
      C 77,182 81,168 94,165
      C 108,162 124,164 131,169
      C 132,175 122,184 109,191
      C 97,197 86,202 80,196
      Z" fill="#9E4E3E" stroke="#2B3A4A" stroke-width="1.2" stroke-linejoin="round"/>

    <!-- Large Intestine: Cecum [244..263, 78..101], Ascending Colon [203..246, 74..96], Transverse, Descending Colon [210..263, 138..156],
         Rectum [253..270, 104..134], Anus [270..285, 108..122] -->
    <path d="
      M 86,254
      C 82,244 82,226 84,212
      C 86,205 94,205 106,208
      C 120,211 134,209 144,212
      C 150,215 151,230 148,246
      C 146,256 138,260 126,260
      C 118,260 115,264 115,274
      L 115,282
      " fill="none" stroke="#DFC0AE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="
      M 86,254
      C 82,244 82,226 84,212
      C 86,205 94,205 106,208
      C 120,211 134,209 144,212
      C 150,215 151,230 148,246
      C 146,256 138,260 126,260
      C 118,260 115,264 115,274
      L 115,282
      " fill="none" stroke="#2B3A4A" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="1000"/>
    <!-- Haustral segmentation ticks along colon -->
    <g stroke="#2B3A4A" stroke-width="0.9" fill="none" stroke-linecap="round">
      <path d="M 79,246 Q 85,248 91,246 M 78,233 Q 84,235 90,233 M 79,220 Q 85,222 91,220"/>
      <path d="M 100,203 Q 102,209 100,214 M 116,205 Q 118,211 116,216 M 132,205 Q 134,211 132,216"/>
      <path d="M 142,224 Q 148,226 154,224 M 142,238 Q 148,240 154,238 M 140,251 Q 146,253 151,251"/>
    </g>
    <!-- Appendix hint at cecum -->
    <path d="M 86,259 C 89,264 94,264 96,261" fill="none" stroke="#2B3A4A" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Small Intestine coils [220..253, 95..139] -->
    <path d="
      M 99,223 C 107,219 125,219 133,224
      C 138,227 137,232 128,233
      C 116,234 103,231 98,236
      C 94,240 99,244 110,244
      C 122,244 135,241 136,247
      C 137,252 124,254 112,253
      C 102,252 96,250 93,254
      " fill="none" stroke="#E8C9B8" stroke-width="7.5" stroke-linecap="round"/>
    <path d="
      M 99,223 C 107,219 125,219 133,224
      C 138,227 137,232 128,233
      C 116,234 103,231 98,236
      C 94,240 99,244 110,244
      C 122,244 135,241 136,247
      C 137,252 124,254 112,253
      " fill="none" stroke="#2B3A4A" stroke-width="1.05" stroke-linecap="round"/>

    <!-- Subtle groin/inguinal folds [261..286, 68..107 & 121..166] -->
    <path d="M 70,264 C 80,274 92,281 104,284 M 166,264 C 156,274 144,281 132,284" fill="none" stroke="#8594A3" stroke-width="0.95" stroke-linecap="round"/>
  </g>
</svg>
