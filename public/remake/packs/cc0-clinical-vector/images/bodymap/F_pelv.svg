    <!-- Soft anatomical contours: inguinal crease, vulval cleft & natal/gluteal cleft -->
    <path d="M 48,88 C 64,108 92,118 119,113 C 131,106 141,91 148,70 C 138,88 127,102 114,106 C 92,112 66,104 48,88 Z"
