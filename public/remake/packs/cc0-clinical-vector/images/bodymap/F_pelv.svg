    <path d="M 61,95 C 71,90 86,91 103,97 C 108,99 111,102 110,105" fill="none" stroke="#2B3A4A" stroke-width="1.0" stroke-linecap="round"/>
    <path d="M 62,97 C 72,105 88,110 105,108 C 108,107.5 110,106 110,105" fill="none" stroke="#2B3A4A" stroke-width="1.0" stroke-linecap="round"/>

