    <path d="M 29,70 L 29,136 L 149,136 L 151,105 Z" fill="#D6CCC0" stroke="none"/>
    <path d="M 29,70 L 29,136 M 149,108 L 149,136" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>

