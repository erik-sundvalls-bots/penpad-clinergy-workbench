<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Adult Female Pelvic and Perineal Anatomy -->
<svg xmlns="http://www.w3.org/2000/svg" width="196" height="142" viewBox="0 0 196 142" shape-rendering="geometricPrecision">
