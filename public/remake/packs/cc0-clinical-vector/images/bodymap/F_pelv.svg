    <ellipse cx="101.5" cy="102.5" rx="6.2" ry="4.0" fill="#D4A39B" stroke="#2B3A4A" stroke-width="1.05"/>
    <path d="M 97.5,102.5 Q 101.5,104 105.5,102.5" fill="none" stroke="#8C5D55" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Anus [93..111, 109..127] -->
    <ellipse cx="118.5" cy="102" rx="5.5" ry="3.8" fill="#D4A39B" stroke="#2B3A4A" stroke-width="1.05"/>
    <path d="M 115,102 Q 118.5,101.5 122,102" fill="none" stroke="#2B3A4A" stroke-width="0.9" stroke-linecap="round"/>
    <path d="M 116.5,100 L 117.5,101.2 M 118.5,99.2 L 118.5,100.8 M 120.5,100 L 119.5,101.2 M 116.8,104 L 117.8,102.8 M 120.2,104 L 119.2,102.8"
