<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Adult Female Urogenital Anatomy -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="330" viewBox="0 0 240 330" shape-rendering="geometricPrecision">
  <title>Adult Female Urogenital Anatomy</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="240" height="330" fill="#FFFFFF"/>

  <g id="female-urogenital">
    <!-- === URINARY TRACT (left side) === -->
    <!-- Aorta & IVC segment context beside kidney -->
    <rect x="76" y="64" width="7" height="62" rx="2" fill="#2D6BA8" stroke="#1D4A78" stroke-width="0.9"/>
    <rect x="85" y="64" width="7" height="62" rx="2" fill="#C43C3C" stroke="#8F2424" stroke-width="0.9"/>
    <!-- Renal artery & vein connecting to right kidney -->
    <path d="M 85,95 L 62,95" stroke="#C43C3C" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M 76,102 L 62,102" stroke="#2D6BA8" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Adrenal cap context -->
    <path d="M 48,72 C 53,64 64,64 68,74 Z" fill="#E0B95B" stroke="#9C7823" stroke-width="0.9"/>

    <!-- Kidney [62..137, 10..73] -->
    <path d="
      M 44,68
      C 22,68 13,86 15,108
      C 17,127 32,137 49,134
      C 62,131 67,120 64,108
      C 62,102 63,95 66,87
      C 69,76 60,68 44,68
      Z" fill="#9E534A" stroke="#2B3A4A" stroke-width="1.35" stroke-linejoin="round"/>
    <path d="M 43,79 C 29,82 24,98 28,113 C 31,123 42,126 52,121" fill="none" stroke="#D89A92" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Ureter [138..233, 42..79] -->
    <path d="M 59,108 C 56,142 56,184 62,216 C 65,228 72,236 80,242"
          fill="none" stroke="#D6B792" stroke-width="6" stroke-linecap="round"/>
    <path d="M 59,108 C 56,142 56,184 62,216 C 65,228 72,236 80,242"
          fill="none" stroke="#2B3A4A" stroke-width="1.15" stroke-linecap="round"/>

    <!-- Urinary Bladder [234..268, 64..136] -->
    <path d="
      M 68,247
      C 68,235 84,234 100,234
      C 116,234 132,235 132,247
      C 132,260 116,268 100,268
      C 84,268 68,260 68,247
      Z" fill="#D6B792" stroke="#2B3A4A" stroke-width="1.3"/>
    <path d="M 78,248 C 86,242 114,242 122,248" fill="none" stroke="#9B7E58" stroke-width="0.95" stroke-linecap="round"/>

    <!-- Female Urethra [269..303, 86..114] -->
    <path d="M 96,268 L 96,299 L 104,299 L 104,268 Z" fill="#D6B792" stroke="#2B3A4A" stroke-width="1.2"/>

    <!-- === FEMALE REPRODUCTIVE TRACT (right side) === -->
    <!-- Left Fallopian Tube (patient's right, viewer's left: Tube1 [155..197, 93..107] & Tube2 [192..205, 97..147]) -->
    <path d="
      M 155,196
      C 140,196 124,199 112,199
      C 101,199 98,190 99,178
      C 100,168 104,160 112,162
      " fill="none" stroke="#BD6D6B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="
      M 155,196
      C 140,196 124,199 112,199
      C 101,199 98,190 99,178
      C 100,168 104,160 112,162
      " fill="none" stroke="#2B3A4A" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Fimbriae fanning over ovary -->
    <path d="M 110,160 L 118,167 M 112,164 L 118,172 M 106,162 L 112,171" stroke="#2B3A4A" stroke-width="1.0" stroke-linecap="round"/>

    <!-- Right Fallopian Tube (viewer's right, symmetric context) -->
    <path d="M 205,196 C 216,195 224,194 228,198" fill="none" stroke="#BD6D6B" stroke-width="6" stroke-linecap="round"/>
    <path d="M 205,196 C 216,195 224,194 228,198" fill="none" stroke="#2B3A4A" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Ovary [168..193, 108..134] -->
    <ellipse cx="121" cy="180.5" rx="12" ry="8.5" transform="rotate(-12 121 180.5)" fill="#EFE1D1" stroke="#2B3A4A" stroke-width="1.25"/>
    <circle cx="117" cy="180" r="2.2" fill="#D5BA9E"/>
    <circle cx="125" cy="179" r="1.8" fill="#D5BA9E"/>
    <circle cx="122" cy="184" r="1.6" fill="#D5BA9E"/>

    <!-- Uterus [178..239, 147..216] -->
    <path d="
      M 152,193
      C 158,180 172,178 180,178
      C 188,178 202,180 208,193
      C 212,202 204,224 192,238
      L 168,238
      C 156,224 148,202 152,193
      Z" fill="#BD6D6B" stroke="#2B3A4A" stroke-width="1.35" stroke-linejoin="round"/>
    <!-- Endometrial cavity coronal cross-section -->
    <path d="M 164,196 C 172,192 188,192 196,196 C 191,210 185,222 183,234 L 177,234 C 175,222 169,210 164,196 Z"
          fill="#8E3D3C" stroke="#2B3A4A" stroke-width="0.9"/>

    <!-- Cervix Uteri [231..255, 165..194] -->
    <path d="M 168,236 L 192,236 L 190,253 C 186,256 174,256 170,253 Z"
          fill="#D8A39B" stroke="#2B3A4A" stroke-width="1.25" stroke-linejoin="round"/>
    <line x1="180" y1="234" x2="180" y2="255" stroke="#2B3A4A" stroke-width="1.2"/>

    <!-- Vagina [250..302, 161..197] -->
    <path d="M 166,252 L 194,252 L 192,301 L 168,301 Z" fill="#E3BCB6" stroke="#2B3A4A" stroke-width="1.25"/>
    <!-- Vaginal rugae subtle clinical lines -->
    <g stroke="#A86D64" stroke-width="0.85" fill="none" stroke-linecap="round">
      <path d="M 171,262 Q 180,265 189,262"/>
      <path d="M 171,272 Q 180,275 189,272"/>
      <path d="M 171,282 Q 180,285 189,282"/>
      <path d="M 171,292 Q 180,295 189,292"/>
    </g>

    <!-- Vulva [299..323, 153..204] -->
    <path d="M 157,301 C 159,314 169,322 180,322 C 191,322 201,314 203,301" fill="url(#skinGrad)" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 166,301 C 168,311 174,316 180,316 C 186,316 192,311 194,301" fill="#D8A39B" stroke="#2B3A4A" stroke-width="1.0"/>
    <line x1="180" y1="302" x2="180" y2="316" stroke="#A86D64" stroke-width="1.0"/>
  </g>
</svg>
