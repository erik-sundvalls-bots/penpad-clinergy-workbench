<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Thoracic Great Vessels Selector -->
<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150" shape-rendering="geometricPrecision">
  <title>Thoracic Great Vessels Selector</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="150" height="150" fill="#FFFFFF"/>

  <g id='thoraxcv'>
  <rect x="7" y="29" width="134" height="21" rx="3.5" fill="#F4F7FA" stroke="#C5D2DF" stroke-width="0.9"/><rect x="7" y="29" width="3.5" height="21" rx="1.5" fill="#C43C3C"/>
  <text x="15" y="43.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.2" font-weight="600" fill="#2B3A4A">pulmonary vessels</text>
  <rect x="7" y="57" width="134" height="22" rx="3.5" fill="#F4F7FA" stroke="#C5D2DF" stroke-width="0.9"/><rect x="7" y="57" width="3.5" height="22" rx="1.5" fill="#C43C3C"/>
  <text x="15" y="71.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.2" font-weight="600" fill="#2B3A4A">inferior vena cava</text>
  <rect x="7" y="86" width="134" height="21" rx="3.5" fill="#F4F7FA" stroke="#C5D2DF" stroke-width="0.9"/><rect x="7" y="86" width="3.5" height="21" rx="1.5" fill="#C43C3C"/>
  <text x="15" y="100.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.2" font-weight="600" fill="#2B3A4A">superior vena cava</text>
  <rect x="7" y="114" width="134" height="20" rx="3.5" fill="#F4F7FA" stroke="#C5D2DF" stroke-width="0.9"/><rect x="7" y="114" width="3.5" height="20" rx="1.5" fill="#C43C3C"/>
  <text x="15" y="127.5" font-family="DejaVu Sans, Arial, sans-serif" font-size="9.2" font-weight="600" fill="#2B3A4A">thoracic aorta</text>
  </g>
</svg>
