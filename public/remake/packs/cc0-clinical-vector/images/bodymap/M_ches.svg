<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Adult Male Anterior Chest -->
<svg xmlns="http://www.w3.org/2000/svg" width="182" height="166" viewBox="0 0 182 166" shape-rendering="geometricPrecision">
  <title>Adult Male Anterior Chest</title>
  <defs>
