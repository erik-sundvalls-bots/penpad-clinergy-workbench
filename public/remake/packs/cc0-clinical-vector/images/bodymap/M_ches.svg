      C 175.5,64 172.5,48 166,41
      C 158,33 143,31 130,28
      C 121,25.5 118,21 117,14
      Z" fill="url(#skinHoriz)" stroke="none"/>

    <!-- Subtle anatomical surface modeling: supraclavicular hollows, pectoral volume, costal arch -->
    <path d="M 55,34 C 66,37 78,38 87,37 C 81,33 69,32 55,34 Z" fill="#C9BCB0" opacity="0.4"/>
    <path d="M 129,34 C 118,37 106,38 97,37 C 103,33 115,32 129,34 Z" fill="#C9BCB0" opacity="0.4"/>
