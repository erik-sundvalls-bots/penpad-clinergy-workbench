    <path d="M 32,159 C 33,134 34,106 36,88 C 37.5,80 40,74 44,69" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 35.5,95 C 37,114 38.5,136 40.5,159" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 152,159 C 151,134 150,106 148,88 C 146.5,80 144,74 140,69" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <path d="M 148.5,95 C 147,114 145.5,136 143.5,159" fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>

    <!-- Sternocleidomastoid & clavicles [23..47, 47..144] -->
    <path d="M 73,17 C 76,27 81,34 86.5,38.5 M 111,17 C 108,27 103,34 97.5,38.5" fill="none" stroke="#5A6C7E" stroke-width="0.95" stroke-linecap="round"/>
    <path d="M 45,35 C 57,39.5 72,42 86,40.5 C 88.5,40.2 90,42 92,43 C 94,42 95.5,40.2 98,40.5 C 112,42 127,39.5 139,35"
