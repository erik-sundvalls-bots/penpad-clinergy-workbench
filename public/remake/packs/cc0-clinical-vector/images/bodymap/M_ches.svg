      <stop offset="68%" stop-color="#E7E0D7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C9BCB0" stop-opacity="0.65"/>
    </radialGradient>
    <linearGradient id="pelvShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="60%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#C9BCB0"/>
    </linearGradient>
    <linearGradient id="cleftShade" x1="0%" y1="0%" x2="0%" y2="100%">
