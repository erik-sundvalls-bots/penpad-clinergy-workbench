    <!-- Deltopectoral grooves -->
    <path d="M 45,39 C 40,48 38,59 38,69 M 139,39 C 144,48 146,59 146,69" fill="none" stroke="#8594A3" stroke-width="0.85" stroke-linecap="round"/>

    <!-- Sternal midline [37..132, 79..107] -->
    <path d="M 92,47 L 92,126" fill="none" stroke="#8594A3" stroke-width="0.85" stroke-linecap="round"/>

    <!-- Pectoralis major inferior borders [81..129] -->
    <path d="M 42,113 C 49,123 68,125 84,120 C 87.5,118.5 89,112 88.5,101" fill="none" stroke="#2B3A4A" stroke-width="1.15" stroke-linecap="round"/>
    <path d="M 142,113 C 135,123 116,125 100,120 C 96.5,118.5 95,112 95.5,101" fill="none" stroke="#2B3A4A" stroke-width="1.15" stroke-linecap="round"/>
    <!-- Anatomically natural male areolae & nipples [102..125, 50..70 & 115..134] -->
    <ellipse cx="60" cy="113" rx="3.8" ry="3.3" fill="#C7A497" stroke="#8F6F64" stroke-width="0.7"/>
    <circle cx="60" cy="113" r="1.2" fill="#8F6F64"/>
    <ellipse cx="124.5" cy="113" rx="3.8" ry="3.3" fill="#C7A497" stroke="#8F6F64" stroke-width="0.7"/>
    <circle cx="124.5" cy="113" r="1.2" fill="#8F6F64"/>

    <!-- Anterior costal margin / ribs [124..158, 38..140] -->
    <path d="M 46,149 C 59,139 76,133 92,129 C 108,133 125,139 138,149" fill="none" stroke="#5A6C7E" stroke-width="0.95" stroke-linecap="round"/>
    <path d="M 55,156 C 67,150 79,145 92,142 C 105,145 117,150 129,156" fill="none" stroke="#8594A3" stroke-width="0.75" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>
