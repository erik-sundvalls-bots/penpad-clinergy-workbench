      C 7,104 8,134 9.5,159
      L 32,159
      C 33,138 34,114 35,96
      C 36.5,112 38,136 40,159
      L 144,159
      C 146,136 147.5,112 149,96
      C 150,114 151,138 152,159
      L 174.5,159
