      <stop offset="50%" stop-color="#C9BCB0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B4A394" stop-opacity="0.35"/>
    </linearGradient>

  </defs>
  <rect width="182" height="166" fill="#FFFFFF"/>

  <g id="male-chest">
