      <stop offset="68%" stop-color="#E7E0D7" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#C9BCB0" stop-opacity="0.65"/>
    </radialGradient>
    <radialGradient id="breastShadeR" cx="58%" cy="38%" r="65%">
