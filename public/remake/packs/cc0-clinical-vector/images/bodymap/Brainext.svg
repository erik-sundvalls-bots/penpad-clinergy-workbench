<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Lateral Cerebral Cortex and Brainstem -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="206" viewBox="0 0 180 206" shape-rendering="geometricPrecision">
  <title>Lateral Cerebral Cortex and Brainstem</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="180" height="206" fill="#FFFFFF"/>

  <g id="brain-lateral" transform="translate(0.0,0.0) scale(1.0,1.0)">
    <!-- Brainstem (pons & medulla) -->
    <path d="M 94,116 C 98,132 100,152 101,176 C 102,188 103,194 103,196 L 122,196 C 122,186 123,172 125,158 C 127,145 129,134 128,122 Z"
          fill="#EDE3DC" stroke="#2B3A4A" stroke-width="1.35" stroke-linejoin="round"/>
    <path d="M 99,136 C 107,139 117,138 124,132 M 102,155 C 109,157 117,156 123,152" fill="none" stroke="#5A6C7E" stroke-width="0.9"/>

    <!-- Cerebellum with fine folia striations -->
    <path d="M 118,118 C 132,118 152,116 158,124 C 162,132 155,146 141,150 C 128,153 118,146 116,136 Z"
          fill="#D4B7AC" stroke="#2B3A4A" stroke-width="1.35" stroke-linejoin="round"/>
    <g stroke="#2B3A4A" stroke-width="0.7" fill="none" opacity="0.65">
      <path d="M 120,124 Q 138,125 155,123"/>
      <path d="M 119,129 Q 138,131 157,128"/>
      <path d="M 118,135 Q 137,137 154,134"/>
      <path d="M 119,141 Q 135,143 149,140"/>
      <path d="M 123,146 Q 134,148 144,145"/>
    </g>

    <!-- Main Cerebral Hemisphere:
         FrontalLobe [28..90, 25..76], ParietalLobe [26..80, 76..126],
         TemporalLobe [81..124, 51..125], OccipitalLobe [46..115, 127..167] -->
    <path d="
      M 25,84
      C 21,64 31,42 52,32
      C 72,22 104,22 128,32
      C 151,42 167,62 167,86
      C 167,104 157,118 142,120
      C 132,121 124,119 116,120
      C 103,124 84,126 70,122
      C 58,118 52,110 53,100
      C 38,100 28,95 25,84
      Z" fill="url(#brainGrad)" stroke="#2B3A4A" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Major anatomical fissures: Central Sulcus (Rolando) & Lateral Sulcus (Sylvius) & Parieto-occipital hint -->
    <!-- Central sulcus separating Frontal & Parietal lobes around x=78..88 -->
    <path d="M 90,26 C 85,42 82,58 77,74" fill="none" stroke="#2B3A4A" stroke-width="1.45" stroke-linecap="round"/>
    <!-- Lateral (Sylvian) fissure separating Frontal/Parietal from Temporal lobe -->
    <path d="M 53,99 C 65,91 84,84 106,79 C 114,77 121,74 126,69" fill="none" stroke="#2B3A4A" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Parieto-occipital division hint around x=126..134 -->
    <path d="M 136,39 C 132,54 128,68 126,82" fill="none" stroke="#5A6C7E" stroke-width="1.15" stroke-linecap="round"/>

    <!-- Natural cortical gyri & sulci across all four lobes -->
    <g fill="none" stroke="#B89A8E" stroke-width="1.2" stroke-linecap="round">
      <!-- Frontal gyri -->
      <path d="M 38,54 C 50,48 64,50 72,58 M 34,70 C 46,66 60,68 68,77 M 54,37 C 64,38 72,44 76,52 M 42,86 C 50,82 58,82 65,86"/>
      <!-- Parietal gyri -->
      <path d="M 102,34 C 98,46 95,58 92,69 M 116,38 C 111,50 108,62 104,72 M 88,52 C 98,53 108,56 116,62"/>
      <!-- Temporal gyri -->
      <path d="M 64,104 C 80,98 100,94 118,89 M 68,114 C 84,111 102,107 120,102"/>
      <!-- Occipital gyri -->
      <path d="M 134,58 C 145,58 154,64 158,74 M 131,78 C 142,76 154,82 158,92 M 130,98 C 140,97 148,101 153,108"/>
    </g>
  </g>
</svg>
