<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Adult Male Urogenital Anatomy -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="330" viewBox="0 0 240 330" shape-rendering="geometricPrecision">
  <title>Adult Male Urogenital Anatomy</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="240" height="330" fill="#FFFFFF"/>

  <g id="male-urogenital">
    <!-- Sagittal pelvic floor & soft-tissue background context (anterior left, posterior sacrum/rectum right) -->
    <path d="
      M 64,142
      C 64,162 62,182 58,200
      C 54,218 53,236 56,252
      C 58,260 66,261 71,254
      C 74,248 76,238 78,230
      C 77,246 80,263 90,267
      C 101,271 112,262 114,248
      C 115,241 116,236 119,235
      L 148,235
      C 162,228 173,210 176,184
      C 178,166 177,150 175,140
      Z" fill="url(#skinGrad)" stroke="none"/>
    <path d="M 76,264 L 76,296 L 146,296 L 146,235" fill="#D6CCC0" opacity="0.55"/>

    <!-- Outer pelvic contour lines -->
    <path d="M 64,142 C 64,162 62,182 58,200 M 175,140 C 177,152 178,166 176,184 C 173,210 162,228 148,235 L 118,235"
          fill="none" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <!-- Posterior rectum context (sagittal clinical clarity) -->
    <path d="M 155,152 C 152,175 148,198 140,218 C 136,226 135,233 135,238 L 149,238 C 151,226 158,204 164,178 C 166,166 167,156 166,150 Z"
          fill="#E2C8C0" stroke="#5A6C7E" stroke-width="1.0"/>

    <!-- Kidney [17..75, 92..139] -->
    <path d="
      M 118,21
      C 102,21 94,36 96,52
      C 98,67 110,74 123,71
      C 132,69 136,61 133,52
      C 131,47 132,42 135,36
      C 138,27 131,21 118,21
      Z" fill="#9E534A" stroke="#2B3A4A" stroke-width="1.35" stroke-linejoin="round"/>
    <path d="M 118,30 C 107,32 103,44 106,56 C 109,64 118,66 125,62" fill="none" stroke="#D89A92" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Ureter [76..155, 112..152] -->
    <path d="M 128,53 C 132,74 135,104 139,130 C 141,146 136,162 128,172"
          fill="none" stroke="#D6B792" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 128,53 C 132,74 135,104 139,130 C 141,146 136,162 128,172"
          fill="none" stroke="#2B3A4A" stroke-width="1.1" stroke-linecap="round"/>

    <!-- Urinary Bladder [159..190, 90..136] -->
    <path d="
      M 94,172
      C 94,159 110,157 125,161
      C 134,164 137,174 133,183
      C 129,190 116,192 104,189
      C 96,186 94,179 94,172
      Z" fill="#D6B792" stroke="#2B3A4A" stroke-width="1.3"/>
    <path d="M 101,173 C 105,166 118,166 126,172" fill="none" stroke="#9B7E58" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Prostate Gland [190..206, 105..131] & seminal vesicle hint -->
    <path d="M 106,192 C 110,189 124,189 128,194 C 130,200 125,206 116,206 C 109,206 105,200 106,192 Z"
          fill="#BD6D6B" stroke="#2B3A4A" stroke-width="1.2"/>
    <path d="M 128,187 C 136,183 142,178 144,172" fill="none" stroke="#5A6C7E" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Pubic symphysis cross-section (anatomical orientation landmark anterior to bladder) -->
    <ellipse cx="86" cy="196" rx="5.5" ry="9" transform="rotate(-18 86 196)" fill="#EAE7E1" stroke="#5A6C7E" stroke-width="1.0"/>

    <!-- Penis [197..257, 53..75] & Urethra [200..219, 72..114] -->
    <path d="
      M 79,198
      C 67,199 58,207 55,222
      C 53,234 53,246 56,253
      C 59,259 68,259 71,252
      C 74,244 75,232 78,222
      C 81,214 89,211 98,210
      " fill="url(#skinGrad)" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glans contour -->
    <path d="M 55,244 C 60,247 67,246 72,243" fill="none" stroke="#5A6C7E" stroke-width="1.0"/>
    <!-- Urethral lumen curving from bladder through prostate, membranous urethra & penile shaft [200..219, 72..114] -->
    <path d="M 116,189 C 116,202 112,211 101,213 C 88,215 74,212 67,222 C 63,230 62,242 63,254"
          fill="none" stroke="#A86D64" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Scrotum, Testis & Epididymis [219..267, 77..110] -->
    <path d="M 78,224 C 77,242 80,261 91,266 C 102,270 112,261 113,245 C 114,234 111,226 106,222"
          fill="url(#skinGrad)" stroke="#2B3A4A" stroke-width="1.35" stroke-linecap="round"/>
    <ellipse cx="94" cy="244" rx="10.5" ry="14" transform="rotate(8 94 244)" fill="#F0E6DC" stroke="#2B3A4A" stroke-width="1.15"/>
    <!-- Epididymis & vas deferens curving cleanly up behind bladder -->
    <path d="M 101,232 C 106,238 106,249 101,256" fill="none" stroke="#5A6C7E" stroke-width="2.0" stroke-linecap="round"/>
    <path d="M 102,231 C 102,216 96,196 100,180 C 104,166 118,168 128,184" fill="none" stroke="#5A6C7E" stroke-width="1.0" stroke-linecap="round"/>
  </g>
</svg>
