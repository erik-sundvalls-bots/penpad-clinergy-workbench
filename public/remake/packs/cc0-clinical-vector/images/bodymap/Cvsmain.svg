<?xml version="1.0" encoding="UTF-8"?>
<!-- Original CC0 1.0 clinical body-map illustration: Cardiovascular System Overview -->
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="330" viewBox="0 0 240 330" shape-rendering="geometricPrecision">
  <title>Cardiovascular System Overview</title>
  <defs>
    <linearGradient id="skinGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#F3EFEA"/>
      <stop offset="55%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="skinHoriz" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D6CCC0"/>
      <stop offset="30%" stop-color="#F3EFEA"/>
      <stop offset="70%" stop-color="#E7E0D7"/>
      <stop offset="100%" stop-color="#D6CCC0"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E6E7E"/>
      <stop offset="100%" stop-color="#3E4C5B"/>
    </linearGradient>
    <linearGradient id="lungGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED2CC"/>
      <stop offset="100%" stop-color="#D4A69E"/>
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0E0D9"/>
      <stop offset="100%" stop-color="#D6B9AE"/>
    </linearGradient>
    
  </defs>
  <rect width="240" height="330" fill="#FFFFFF"/>

  <g id="cvs-main">
    <!-- Clean standing human silhouette centered at x=118 (Head [35..70,99..137], Neck [69..93], Thorax [80..126], Abdomen [126..174],
         ArmVein [81..190,54..92], ArmArt [80..196,146..181], LegVein [175..314,90..117], LegArt [175..314,119..145]) -->
    <path d="
      M 118,36
      C 110,36 105,43 105,53
      C 105,62 108.5,69 112.5,72.5
      L 112.5,82
      C 104,84 93,86 88,92
      C 82,99 78,114 73,131
      C 68,147 62,163 59,174
      C 55,179 52,188 53,195
      C 55,198 59,197 62,193
      C 65,188 68,181 69,176
      C 74,162 81,144 86,128
      C 88,121 90,115 92,110
      C 93,124 94,142 95,156
      C 93,168 91,182 91,196
      C 91,218 93,242 96,262
      C 97,276 98,290 99,302
      C 97,308 93,314 95,317
      C 98,320 106,319 108,314
      C 109,307 109,296 109,284
      C 111,264 113,234 116.5,204
      L 119.5,204
      C 123,234 125,264 127,284
      C 127,296 127,307 128,314
      C 130,319 138,320 141,317
      C 143,314 139,308 137,302
      C 138,290 139,276 140,262
      C 143,242 145,218 145,196
      C 145,182 143,168 141,156
      C 142,142 143,124 144,110
      C 146,115 148,121 150,128
      C 155,144 162,162 167,176
      C 168,181 171,188 174,193
      C 177,197 181,198 183,195
      C 184,188 181,179 177,174
      C 174,163 168,147 163,131
      C 158,114 154,99 148,92
      C 143,86 132,84 123.5,82
      L 123.5,72.5
      C 127.5,69 131,62 131,53
      C 131,43 126,36 118,36
      Z" fill="#F8F9FB" stroke="#8594A3" stroke-width="1.15" stroke-linejoin="round"/>

    <!-- === VENOUS SYSTEM (viewer's left: SVC/IVC, jugular, arm veins, iliac/femoral/saphenous veins) === -->
    <g fill="none" stroke="#2D6BA8" stroke-linecap="round" stroke-linejoin="round">
      <!-- Jugular & cerebral veins -->
      <path d="M 114,96 L 113,70 C 112,58 111,48 114,42" stroke-width="2.0"/>
      <path d="M 113,84 C 109,75 109,65 110,55" stroke-width="1.1"/>
      <!-- Subclavian -> axillary -> cephalic / brachial / basilic arm veins [81..190, 54..92] -->
      <path d="M 114,91 C 103,89 92,92 86,102 C 80,118 72,142 64,172 L 58,190" stroke-width="2.0"/>
      <path d="M 88,99 C 80,108 75,126 68,150 L 62,175 L 56,188" stroke-width="1.2"/>
      <path d="M 85,112 C 81,126 76,142 70,158 L 65,178 L 63,191" stroke-width="1.1"/>
      <path d="M 73,135 L 78,141" stroke-width="1.0"/>
      <!-- SVC & IVC trunk -->
      <path d="M 114,92 L 114,174" stroke-width="3.2"/>
      <!-- Hepatic / renal venous branches -->
      <path d="M 113,136 L 101,134 M 113,149 L 100,151" stroke-width="1.3"/>
      <!-- Common iliac -> femoral -> popliteal -> tibial & saphenous leg veins [175..314, 90..117] -->
      <path d="M 114,173 C 108,180 103,188 102,202 C 101,226 102,250 103,274 L 104,306 L 99,315" stroke-width="2.3"/>
      <path d="M 104,195 C 108,214 109,240 108,268 L 106,304" stroke-width="1.3"/>
      <path d="M 102,248 C 99,266 99,288 101,306" stroke-width="1.1"/>
    </g>

    <!-- === ARTERIAL SYSTEM (viewer's right: aortic arch, carotids, arm arteries, descending aorta, leg arteries) === -->
    <g fill="none" stroke="#C43C3C" stroke-linecap="round" stroke-linejoin="round">
      <!-- Carotid & cerebral arteries -->
      <path d="M 122,94 L 123,70 C 124,58 125,48 122,42" stroke-width="2.0"/>
      <path d="M 123,84 C 127,74 127,64 126,54" stroke-width="1.1"/>
      <!-- Subclavian -> axillary -> brachial -> radial & ulnar -> palmar arch [80..196, 146..181] -->
      <path d="M 122,91 C 133,89 144,92 150,102 C 156,118 164,142 172,172" stroke-width="2.1"/>
      <path d="M 160,136 C 166,150 172,166 177,182 L 180,192" stroke-width="1.25"/>
      <path d="M 160,136 C 162,152 167,168 171,182 L 174,193" stroke-width="1.25"/>
      <path d="M 171,182 Q 175,186 178,182" stroke-width="1.1"/>
      <!-- Aortic arch & thoracic/abdominal aorta -->
      <path d="M 118,96 C 118,89 124,89 124,97 L 122,174" stroke-width="3.2"/>
      <!-- Visceral & renal arterial branches -->
      <path d="M 123,136 L 135,134 M 123,149 L 136,151 M 123,160 L 132,163" stroke-width="1.3"/>
      <!-- Iliac -> femoral -> popliteal -> tibial & pedal arteries [175..314, 119..145] -->
      <path d="M 122,173 C 128,180 133,188 134,202 C 135,226 134,250 133,274 L 132,306 L 138,315" stroke-width="2.3"/>
      <path d="M 134,248 C 137,266 137,288 135,306" stroke-width="1.2"/>
      <path d="M 132,248 C 129,268 129,290 131,308" stroke-width="1.15"/>
    </g>

    <!-- Anatomical Heart [93..121, 109..130] -->
    <path d="M 119,96 C 115,94 110,97 110,104 C 110,111 116,118 122,121 C 127,118 130,111 129,103 C 128,97 123,95 119,96 Z"
          fill="#C43C3C" stroke="#8F2424" stroke-width="1.2"/>
    <path d="M 115,103 C 118,107 121,112 124,117" fill="none" stroke="#F4B6B6" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
