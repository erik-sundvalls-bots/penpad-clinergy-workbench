# Clinergy names: (c) 1997-8 Semantic Technologies Ltd / Victoria University of Manchester.
# OpenGALEN names: GALEN Open Source License. SNOMED CT: IHTSDO / SNOMED International.
# verified: false means the code was not confirmed. Do not treat those rows as bindings.
# match: = equivalent, ? inexact, > Clinergy concept is broader than the target, < Clinergy concept is narrower.
# openEHR TERM_MAPPING.match accepts '=', '<', '>' and '?'. The reviewed file used '~' for inexact; that symbol is stored as '?'.
# SNOMED CT rechecked 2026-11-16 on HL7 Nordics https://tx-nordics.fhir.org/fhir/r4
# (CodeSystem/$lookup, CodeSystem/$validate-code, ValueSet/$expand). Edition
# http://snomed.info/sct/900000000000207008/version/20260801 (SNOMED CT International).
# Each concept id inside a post-coordinated expression was looked up and validated. The expression
# itself was not submitted as a code.
