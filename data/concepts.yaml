# Displays the sentence generator needs for the thumb forms.
# Topic displays are copied from ThumbPainSymptom.yaml and ThumbSwellingSymptom.yaml.
# PainSymptom and SwellingSymptom are the grammatical heads of those
# pre-coordinated names ("thumb pain" -> "pain", "thumb swelling" -> "swelling").
# The ancestor concept records were not in the attached extract; the heads are
# the words in the five known-good sentences.
# Value displays that are not a plain de-camelcase are the button words read
# from the public walkthrough (https://pen-pad-revival.github.io/docs/clinergy-thumb-pain-demo/).
# Clinergy names: Content (c) 1997-8 Semantic Technologies Ltd / Victoria University of Manchester.
# Published here with the owner's approval, for demonstration only. See README.md.
