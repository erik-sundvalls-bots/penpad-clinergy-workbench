    adjective: vänster
    adjectiveForms:
      en: vänster
      ett: vänster
      plural: vänstra
      definite: vänstra
  right:
    adjective: höger
    adjectiveForms:
      en: höger
      ett: höger
      plural: högra
      definite: högra
